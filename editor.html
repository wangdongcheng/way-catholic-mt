<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Edit exam routes, observations, and critical violations on a map." />
  <title>Route Editor — MDTS - Malta Driving Test Simulator</title>
</head>

<body>
  <main id="editor-app">
    <header class="editor-toolbar">
      <div class="brand-block">
        <span class="eyebrow">MDTS</span>
        <h1>Route Editor</h1>
      </div>

      <label class="toolbar-field">
        <span>Data set</span>
        <select id="route-selector" disabled></select>
      </label>

      <label class="toolbar-field route-name-field">
        <span>Name</span>
        <input id="route-name" type="text" disabled />
      </label>

      <div class="toolbar-actions">
        <button id="connect-folder-button" class="button" type="button">
          Connect data folder
        </button>
        <button id="new-route-button" class="button" type="button" disabled>
          New route
        </button>
        <button id="add-event-button" class="button primary" type="button" disabled>
          + Add event
        </button>
        <button id="save-button" class="button" type="button" disabled>Save</button>
      </div>
    </header>

    <section class="editor-workspace">
      <div class="map-pane">
        <div id="editor-map" aria-label="Route event map"></div>

        <div class="map-legend" aria-label="Map legend">
          <span><i class="legend-dot message"></i>Observation</span>
          <span><i class="legend-dot command"></i>Examiner command</span>
          <span><i class="legend-dot critical"></i>Critical violation</span>
          <span><i class="legend-ring answer"></i>Answer range</span>
          <span><i class="legend-wedge"></i>Heading</span>
        </div>

        <div id="placement-notice" class="placement-notice" hidden>
          Click the map to place the event · Esc to cancel
        </div>
      </div>

      <aside class="editor-sidebar">
        <div class="sidebar-heading">
          <div>
            <span class="eyebrow">Selected event</span>
            <h2 id="selected-event-title">Nothing selected</h2>
          </div>
          <span id="dirty-indicator" class="dirty-indicator">Saved source</span>
        </div>

        <div id="event-form" class="event-form">
          <div class="empty-state">
            Right-click the map to add an event, or select an existing marker.
          </div>
        </div>
      </aside>
    </section>

    <footer class="editor-statusbar">
      <span id="editor-status">Loading route…</span>
      <button id="validation-toggle" type="button" class="status-button">
        Validation: <span id="validation-summary">—</span>
      </button>
    </footer>
  </main>

  <div id="add-event-menu" class="context-menu" hidden>
    <button type="button" data-create-type="observation-check" data-document="observation">Observation check</button>
    <button type="button" data-create-type="critical-violation" data-document="critical">Critical violation</button>
    <button type="button" data-create-type="single" data-document="exam">Single-choice command</button>
    <button type="button" data-create-type="multiple" data-document="exam">Multiple-choice command</button>
    <button type="button" data-create-type="sequence" data-document="exam">Sequence command</button>
  </div>

  <dialog id="validation-dialog">
    <div class="dialog-header">
      <h2>Route validation</h2>
      <button id="validation-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="validation-results"></div>
  </dialog>

  <dialog id="new-route-dialog">
    <form id="new-route-form" class="new-route-form">
      <div class="dialog-header">
        <h2>New route</h2>
        <button id="new-route-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="new-route-fields">
        <label class="form-field">
          <span>Route ID</span>
          <input id="new-route-id" name="routeId" type="text"
            pattern="[A-Za-z0-9][A-Za-z0-9_-]*" required />
          <span class="form-help">Used as the saved JSON filename.</span>
        </label>
        <label class="form-field">
          <span>Name</span>
          <input id="new-route-name" name="routeName" type="text" required />
        </label>
      </div>
      <div class="dialog-actions">
        <button id="new-route-cancel" class="button" type="button">Cancel</button>
        <button class="button primary" type="submit">Create route</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/src/editor/editor-main.js"></script>
</body>

</html>
