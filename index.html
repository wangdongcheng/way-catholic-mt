<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Way</title>
</head>

<body>
  <div id="street-view"></div>

  <div id="current-info" class="hidden">
    <div>Route: <span id="current-route">-</span></div>
    <div>Pos: <span id="current-pos">-</span></div>
    <div>Pano: <span id="current-pano">-</span></div>
    <div>Heading: <span id="camera-heading">-</span>°</div>
    <div>Location: <span id="current-location">-</span></div>
  </div>

  <dialog id="exam-start-dialog" aria-labelledby="exam-start-title">
    <div id="exam-start-panel">
      <div id="exam-start-eyebrow">Driving Test</div>
      <h1 id="exam-start-title">Before the test</h1>
      <ul id="exam-start-items"></ul>
      <button id="exam-start-button" type="button">Start Exam</button>
    </div>
  </dialog>

  <dialog id="route-message" aria-labelledby="route-message-text">
    <div id="route-message-panel">
      <span id="route-message-text"></span>
      <button id="route-message-ok" type="button">OK</button>
    </div>
  </dialog>

  <section
    id="examiner-command"
    role="dialog"
    aria-modal="false"
    aria-labelledby="examiner-command-text"
    hidden
  >
    <div id="examiner-header">Examiner</div>
    <div id="examiner-command-text"></div>
    <div id="examiner-options"></div>
    <div id="examiner-actions" class="hidden">
      <button id="examiner-undo" type="button">Undo</button>
      <button id="examiner-reset" type="button">Reset</button>
      <button id="examiner-confirm" type="button">Confirm</button>
    </div>
  </section>

  <div id="penalty-status">
    Penalty: <span id="penalty-score">0</span>
  </div>

  <button id="restart-button" type="button" aria-label="Restart route">
    ↺ Restart
  </button>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
